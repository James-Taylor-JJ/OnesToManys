<!DOCTYPE html>
<html>
<head>
    <title>Music Tracks App</title>
</head>
<body>

    <h1>Music Tracks App</h1>

    <h2>Search Track</h2>
    <select id="track-selector" onchange="handleTrackSelection()">
        <option value="">-- Search by Track --</option>
    </select>

    <h3>Track Information</h3>
    <p><strong>Name:</strong> <span id="track-name-display">None selected</span></p>
    <p><strong>Description:</strong> <span id="track-description-display">None selected</span></p>

    <h2>Search Course</h2>
    <select id="course-selector" onchange="handleCourseSelection()">
        <option value="">-- Search by Course --</option>
    </select>

    <h3>Selected Course</h3>
    <div>
        <input id="selected-course-field" value="None selected" readonly>
        <button onclick="deleteSelectedCourse()">Delete</button>
    </div>

    <h3>Course Information</h3>
    <p><strong>Title:</strong> <span id="course-title-display">None selected</span></p>
    <p><strong>Description:</strong> <span id="course-description-display">None selected</span></p>
    <p><strong>Topics:</strong> <span id="course-topics-display">None selected</span></p>
    <p><strong>Parent Track:</strong> <span id="course-track-display">None selected</span></p>

    <script src="script.js"></script>

</body>
</html>
