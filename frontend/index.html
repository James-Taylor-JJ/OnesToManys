<!DOCTYPE html>
<html>
<head>
    <title>Music Tracks App</title>
</head>
<body>
    <h1>Tracks</h1>
    <p>Click a track to load its courses.</p>

    <h2>Create Track</h2>
    <input id="track-name" placeholder="Track name">
    <input id="track-description" placeholder="Description">
    <button onclick="createTrack()">Add Track</button>

    <h2>Track List</h2>
    <ul id="track-list"></ul>

    <h2>Courses</h2>
    <ul id="course-list"></ul>

    <script src="script.js"></script>
</body>
</html>
