<!DOCTYPE html>
<html>
<head>
    <title>Music Tracks App</title>
    <style>
        .wide-input {
            width: 420px;
            margin-bottom: 8px;
        }

        .wide-textarea {
            width: 420px;
            height: 70px;
            margin-bottom: 8px;
        }

        .inline-delete {
            display: flex;
            align-items: end;
            gap: 8px;
        }

        .section {
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>Music Tracks App</h1>

    <div class="section">
        <h2>Create Track</h2>

        <div>
            <label>Track ID</label><br>
            <input id="create-track-id" class="wide-input" placeholder="Track ID">
        </div>

        <div>
            <label>Name</label><br>
            <input id="create-track-name" class="wide-input" placeholder="Track name">
        </div>

        <div>
            <label>Description</label><br>
            <textarea id="create-track-description" class="wide-textarea" placeholder="Track description"></textarea>
        </div>

        <button onclick="createTrack()">Create Track</button>
    </div>

    <div class="section">
        <h3>Search Track</h3>
        <select id="track-selector" onchange="handleTrackSelection()">
            <option value="">-- Search by Track --</option>
        </select>
    </div>

    <div class="section">
        <h3>Selected Track</h3>

        <div>
            <label>Track ID</label><br>
            <input id="selected-track-id" class="wide-input" value="" readonly>
        </div>

        <div>
            <label>Name</label><br>
            <input id="selected-track-name" class="wide-input" value="" readonly>
        </div>

        <div class="inline-delete">
            <div>
                <label>Description</label><br>
                <textarea id="selected-track-description" class="wide-textarea" readonly></textarea>
            </div>
            <button onclick="deleteSelectedTrack()">Delete</button>
        </div>
    </div>

    <div class="section">
        <h3>Update Selected Track</h3>

        <div>
            <label>Track ID</label><br>
            <input id="update-track-id" class="wide-input" readonly>
        </div>

        <div>
            <label>Name</label><br>
            <input id="update-track-name" class="wide-input" placeholder="Updated track name">
        </div>

        <div>
            <label>Description</label><br>
            <textarea id="update-track-description" class="wide-textarea" placeholder="Updated track description"></textarea>
        </div>

        <button onclick="updateSelectedTrack()">Update Track</button>
    </div>

    <div class="section">
        <h2>Create Course</h2>

        <div>
            <label>Course ID</label><br>
            <input id="create-course-id" class="wide-input" placeholder="Course ID">
        </div>

        <div>
            <label>Track ID</label><br>
            <input id="create-course-track-id" class="wide-input" placeholder="Track ID">
        </div>

        <div>
            <label>Title</label><br>
            <input id="create-course-title" class="wide-input" placeholder="Course title">
        </div>

        <div>
            <label>Description</label><br>
            <textarea id="create-course-description" class="wide-textarea" placeholder="Course description"></textarea>
        </div>

        <div>
            <label>Topics</label><br>
            <textarea id="create-course-topics" class="wide-textarea" placeholder="Topics"></textarea>
        </div>

        <button onclick="createCourse()">Create Course</button>
    </div>

    <div class="section">
        <h3>Search Course</h3>
        <select id="course-selector" onchange="handleCourseSelection()">
            <option value="">-- Search by Course --</option>
        </select>
    </div>

    <div class="section">
        <h3>Selected Course</h3>

        <div>
            <label>Course ID</label><br>
            <input id="selected-course-id" class="wide-input" value="" readonly>
        </div>

        <div>
            <label>Track ID</label><br>
            <input id="selected-course-track-id" class="wide-input" value="" readonly>
        </div>

        <div>
            <label>Title</label><br>
            <input id="selected-course-title" class="wide-input" value="" readonly>
        </div>

        <div>
            <label>Description</label><br>
            <textarea id="selected-course-description" class="wide-textarea" readonly></textarea>
        </div>

        <div class="inline-delete">
            <div>
                <label>Topics</label><br>
                <textarea id="selected-course-topics" class="wide-textarea" readonly></textarea>
            </div>
            <button onclick="deleteSelectedCourse()">Delete</button>
        </div>
    </div>

    <div class="section">
        <h3>Update Selected Course</h3>

        <div>
            <label>Course ID</label><br>
            <input id="update-course-id" class="wide-input" readonly>
        </div>

        <div>
            <label>Track ID</label><br>
            <input id="update-course-track-id" class="wide-input" placeholder="Track ID">
        </div>

        <div>
            <label>Title</label><br>
            <input id="update-course-title" class="wide-input" placeholder="Updated title">
        </div>

        <div>
            <label>Description</label><br>
            <textarea id="update-course-description" class="wide-textarea" placeholder="Updated description"></textarea>
        </div>

        <div>
            <label>Topics</label><br>
            <textarea id="update-course-topics" class="wide-textarea" placeholder="Updated topics"></textarea>
        </div>

        <button onclick="updateSelectedCourse()">Update Course</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
