<!DOCTYPE html>
<html>
<head>
    <title>Music Tracks App</title>
</head>
<body>

    <h1>Tracks</h1>

    <h2>Select Track</h2>
    <select id="track-selector" onchange="handleTrackSelection()">
        <option value="">-- Select a Track --</option>
    </select>

    <p id="track-description"></p>

    <h2>Create Track</h2>
    <input id="track-name" placeholder="Track name">
    <input id="track-description-input" placeholder="Description">
    <button onclick="createTrack()">Add Track</button>

    <h2>Create Course (for selected track)</h2>
    <input id="course-title" placeholder="Course title">
    <input id="course-description" placeholder="Course description">
    <input id="course-topics" placeholder="Topics">
    <button onclick="createCourse()">Add Course</button>

    <h2>Courses</h2>
    <ul id="course-list"></ul>

    <script src="script.js"></script>

</body>
</html>
